<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finanzas Robustas</title><link rel="manifest" href="manifest.json"><style>body{font-family:Arial;background:#eef2f7;margin:10px}.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0}.dark{background:#111;color:#eee}.btn{padding:8px}.kpi{font-size:24px;font-weight:bold}canvas{max-width:100%}</style></head><body><h2>Finanzas Robustas</h2><button onclick="toggleDark()">Modo oscuro</button><div class=card><input id=pin placeholder='PIN'><button onclick='savePin()'>Guardar PIN</button></div><div class=card><input id=income type=number value=3460><button onclick='setIncome()'>Nómina</button><div id=disp class=kpi></div><div id=forecast></div></div><div class=card><h3>Gasto</h3><select id=cat></select><input id=amt type=number><button onclick='addMove()'>Agregar</button><input id=newcat placeholder='Categoría'><button onclick='addCat()'>Crear</button></div><div class=card><h3>Metas</h3><input id=gn><input id=gt type=number><button onclick='addGoal()'>Meta</button><div id=goals></div></div><div class=card><h3>Pagos</h3><input id=pn placeholder='Concepto'><input id=pa type=number><input id=pd type=date><button onclick='addPay()'>Agregar</button><div id=pays></div></div><div class=card><button onclick='backup()'>Exportar</button><input type=file onchange='restore(event)'></div><div class=card><canvas id=chart width=300 height=180></canvas></div><div class=card id=hist></div><script>let d=JSON.parse(localStorage.finapp||'{"income":3460,"cats":["Renta","Agua","Gasolina","Comida","Credito"],"moves":[],"goals":[],"pays":[],"pin":""}');function save(){localStorage.finapp=JSON.stringify(d);render()}function setIncome(){d.income=+income.value;save()}function addCat(){if(newcat.value)d.cats.push(newcat.value),save()}function addMove(){d.moves.push({cat:cat.value,amount:+amt.value,date:new Date().toISOString()});save()}function addGoal(){d.goals.push({name:gn.value,target:+gt.value,saved:0});save()}function addPay(){d.pays.push({name:pn.value,amount:+pa.value,date:pd.value});save()}function savePin(){d.pin=pin.value;save();alert('PIN guardado')}function toggleDark(){document.body.classList.toggle('dark')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)]));a.download='finanzas_backup.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{d=JSON.parse(r.result);save()};r.readAsText(e.target.files[0])}function render(){cat.innerHTML=d.cats.map(v=>`<option>${v}</option>`).join('');let g=d.moves.reduce((s,x)=>s+x.amount,0);let saldo=d.income-g;disp.textContent='Disponible: $'+saldo.toFixed(2);forecast.textContent='Presupuesto diario: $'+(saldo/7).toFixed(2);hist.innerHTML=d.moves.slice().reverse().map(x=>`${x.cat} $${x.amount}`).join('<br>');goals.innerHTML=d.goals.map(x=>`${x.name}: ${Math.round(((x.saved||0)/(x.target||1))*100)}%<progress max=100 value=${((x.saved||0)/(x.target||1))*100}></progress>`).join('');let t=new Date().toISOString().slice(0,10);pays.innerHTML=d.pays.map(x=>`${x.date<t?'🔴':'🟡'} ${x.date} ${x.name} $${x.amount}`).join('<br>');draw()}function draw(){let c=document.getElementById('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let sums={};d.moves.forEach(m=>sums[m.cat]=(sums[m.cat]||0)+m.amount);let vals=Object.values(sums);let total=vals.reduce((a,b)=>a+b,0)||1;let start=0;['#f66','#6af','#6c6','#fc6','#c6f','#999'].forEach((col,i)=>{if(!vals[i])return;let ang=(vals[i]/total)*Math.PI*2;ctx.beginPath();ctx.moveTo(150,90);ctx.fillStyle=col;ctx.arc(150,90,80,start,start+ang);ctx.fill();start+=ang;});}if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');render();</script></body></html>
