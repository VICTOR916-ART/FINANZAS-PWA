<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanzas Pro 5.0</title>

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--txt:#f8fafc;
--acc:#38bdf8;
}

body{
background:var(--bg);
color:var(--txt);
font-family:Arial;
margin:0;
padding:12px;
}

.card{
background:var(--card);
padding:12px;
border-radius:12px;
margin:10px 0;
}

input,select,button{
padding:8px;
margin:4px;
border-radius:6px;
}

button{
background:var(--acc);
border:0;
cursor:pointer;
}

.kpi{
font-size:32px;
font-weight:bold;
}

.item{
padding:8px;
margin:6px 0;
background:#334155;
border-radius:8px;
}
</style>

</head>
<body>

<h1>💰 Finanzas Pro 5.0</h1>

<div class="card">
<h3>Dashboard</h3>

<div id="saldo" class="kpi"></div>

<div id="proy"></div>

<div id="totales"></div>
</div>

<div class="card">

<h3>Ingresos</h3>

<input id="income" type="number" placeholder="Monto">

<button onclick="saveIncome()">
Agregar ingreso
</button>

<h4>Ingresos registrados</h4>

<div id="incomeList"></div>

</div>

<div class="card">

<h3>Gastos</h3>

<select id="cat"></select>

<input id="amt" type="number" placeholder="Monto">

<button onclick="addExpense()">
Agregar gasto
</button>

<br>

<input id="newcat" placeholder="Nueva categoría">

<button onclick="addCat()">
Crear
</button>

<h4>Gastos registrados</h4>

<div id="movements"></div>

</div>

<div class="card">

<h3>Metas</h3>

<input id="gn" placeholder="Meta">

<input id="gt" type="number" placeholder="Objetivo">

<button onclick="addGoal()">
Agregar
</button>

<div id="goals"></div>

</div>

<div class="card">

<h3>Pagos próximos</h3>

<input id="pn" placeholder="Nombre">

<input id="pa" type="number" placeholder="Monto">

<input id="pd" type="date">

<button onclick="addPay()">
Agregar
</button>

<div id="payments"></div>

</div>

<div class="card">

<button onclick="backup()">
Exportar respaldo
</button>

<input type="file" onchange="restore(event)">

</div>

<script>

let d=JSON.parse(
localStorage.finv5||
'{"incomes":[],"cats":["Renta","Agua","Gasolina","Comida","Credito"],"exp":[],"goals":[],"payments":[]}'
);

function save(){

localStorage.finv5=
JSON.stringify(d);

render();

}

function render(){

cat.innerHTML=
d.cats.map(
x=>`<option>${x}</option>`
).join('');

let ingresos=
d.incomes.reduce(
(a,b)=>a+b.amount,
0
);

let gastos=
d.exp.reduce(
(a,b)=>a+b.amount,
0
);

let saldoActual=
ingresos-gastos;

saldo.innerHTML=
'$'+saldoActual.toFixed(2);

proy.innerHTML=
'Presupuesto diario: $'+
(saldoActual/7).toFixed(2);

totales.innerHTML=
`
Ingresos: $${ingresos.toFixed(2)}
<br>
Gastos: $${gastos.toFixed(2)}
`;

incomeList.innerHTML=
d.incomes.map(
(x,i)=>`
<div class="item">

💵 $${x.amount}

<br>

${x.date}

<br><br>

<button onclick="editIncome(${i})">
✏️ Editar
</button>

<button onclick="deleteIncome(${i})">
🗑️ Eliminar
</button>

</div>
`
).join('');

movements.innerHTML=
d.exp.map(
(x,i)=>`
<div class="item">

${x.cat}

<br>

-$${x.amount}

<br><br>

<button onclick="editExpense(${i})">
✏️ Editar
</button>

<button onclick="deleteExpense(${i})">
🗑️ Eliminar
</button>

</div>
`
).join('');

goals.innerHTML=
d.goals.map(
x=>`
<div class="item">
🎯 ${x.name} ($${x.target})
</div>
`
).join('');

payments.innerHTML=
d.payments.map(
x=>`
<div class="item">
📅 ${x.date} - ${x.name} - $${x.amount}
</div>
`
).join('');

}

function saveIncome(){

if(!income.value)return;

d.incomes.push({

amount:Number(income.value),

date:new Date().toLocaleDateString()

});

income.value='';

save();

}

function editIncome(i){

let nuevo=
prompt(
"Nuevo monto:",
d.incomes[i].amount
);

if(nuevo!==null){

d.incomes[i].amount=
Number(nuevo);

save();

}

}

function deleteIncome(i){

if(confirm("¿Eliminar ingreso?")){

d.incomes.splice(i,1);

save();

}

}

function addExpense(){

if(!amt.value)return;

d.exp.push({

cat:cat.value,

amount:Number(amt.value)

});

amt.value='';

save();

}

function editExpense(i){

let nuevo=
prompt(
"Nuevo monto:",
d.exp[i].amount
);

if(nuevo!==null){

d.exp[i].amount=
Number(nuevo);

save();

}

}

function deleteExpense(i){

if(confirm("¿Eliminar gasto?")){

d.exp.splice(i,1);

save();

}

}

function addCat(){

if(newcat.value){

d.cats.push(newcat.value);

newcat.value='';

save();

}

}

function addGoal(){

d.goals.push({

name:gn.value,

target:Number(gt.value)

});

gn.value='';
gt.value='';

save();

}

function addPay(){

d.payments.push({

name:pn.value,

amount:Number(pa.value),

date:pd.value

});

pn.value='';
pa.value='';
pd.value='';

save();

}

function backup(){

let a=document.createElement('a');

a.href=
URL.createObjectURL(
new Blob(
[JSON.stringify(d,null,2)]
)
);

a.download='finanzas_backup.json';

a.click();

}

function restore(e){

let r=new FileReader();

r.onload=()=>{

d=JSON.parse(r.result);

save();

};

r.readAsText(
e.target.files[0]
);

}

render();

if('serviceWorker' in navigator){

navigator.serviceWorker.register('sw.js');

}

</script>

</body>
</html>
