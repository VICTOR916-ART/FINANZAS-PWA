<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Finanzas 3.0</title><style>:root{--bg:#0f172a;--card:#1e293b;--txt:#f8fafc;--acc:#38bdf8}body{background:var(--bg);color:var(--txt);font-family:Arial;margin:0;padding:12px}.card{background:var(--card);padding:12px;border-radius:12px;margin:10px 0}input,select,button{padding:8px;margin:4px;border-radius:6px}button{background:var(--acc);border:0}.kpi{font-size:32px;font-weight:bold}</style></head><body><h1>💰 Finanzas Pro 3.0</h1><div class='card'><h3>Dashboard</h3><div id='saldo' class='kpi'></div><div id='proy'></div></div><div class='card'><h3>Nómina</h3><input id='income' type='number' value='3460'><button onclick='saveIncome()'>Guardar</button></div><div class='card'><h3>Gastos</h3><select id='cat'></select><input id='amt' type='number'><button onclick='addExpense()'>Agregar</button><input id='newcat' placeholder='Nueva categoría'><button onclick='addCat()'>Crear</button></div><div class='card'><h3>Metas</h3><input id='gn' placeholder='Meta'><input id='gt' type='number' placeholder='Objetivo'><button onclick='addGoal()'>Agregar</button><div id='goals'></div></div><div class='card'><h3>Pagos próximos</h3><input id='pn'><input id='pa' type='number'><input id='pd' type='date'><button onclick='addPay()'>Agregar</button><div id='payments'></div></div><div class='card'><button onclick='backup()'>Exportar respaldo</button><input type='file' onchange='restore(event)'></div><script>let d=JSON.parse(localStorage.finv3||'{"income":3460,"cats":["Renta","Agua","Gasolina","Comida","Credito"],"exp":[],"goals":[],"payments":[]}');function save(){localStorage.finv3=JSON.stringify(d);render()}function render(){cat.innerHTML=d.cats.map(x=>`<option>${x}</option>`).join('');let g=d.exp.reduce((a,b)=>a+b.amount,0);let s=d.income-g;saldo.innerText='$'+s.toFixed(2);proy.innerText='Presupuesto diario: $'+(s/7).toFixed(2);goals.innerHTML=d.goals.map(x=>`<div>${x.name} ($${x.target})</div>`).join('');payments.innerHTML=d.payments.map(x=>`<div>${x.date} ${x.name} $${x.amount}</div>`).join('')}function saveIncome(){d.income=+income.value;save()}function addExpense(){d.exp.push({cat:cat.value,amount:+amt.value});save()}function addCat(){if(newcat.value)d.cats.push(newcat.value),save()}function addGoal(){d.goals.push({name:gn.value,target:+gt.value});save()}function addPay(){d.payments.push({name:pn.value,amount:+pa.value,date:pd.value});save()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)]));a.download='finanzas_v3_backup.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{d=JSON.parse(r.result);save()};r.readAsText(e.target.files[0])}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
